<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DK Cricket Ops</title><style>
:root{font-family:Arial,sans-serif;color:#17243b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#101b31;color:white;padding:24px 16px}.side h2{font-size:19px}.side button{display:block;width:100%;text-align:left;padding:12px;border:0;border-radius:8px;background:transparent;color:#c7d2e5;cursor:pointer;margin:4px 0}.side button.active,.side button:hover{background:#253552;color:white}.main{padding:28px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.card,.panel{background:white;border:1px solid #e1e7f0;border-radius:13px;padding:17px;margin-bottom:16px}.muted{color:#68768b;font-size:13px}.metric{font-size:25px;font-weight:bold;margin:8px 0}.btn{background:#2463eb;color:white;border:0;border-radius:8px;padding:10px 13px;cursor:pointer}.secondary{background:#eaf0ff;color:#204fc1}.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.form input,.form select,.form textarea{width:100%;padding:10px;border:1px solid #d7deea;border-radius:8px;background:white}.form label{font-size:12px;font-weight:bold;display:grid;gap:5px}.wide{grid-column:1/-1}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf0f5;font-size:13px;white-space:nowrap}th{background:#f7f9fc}.pill{padding:4px 7px;border-radius:20px;background:#fff2d7;color:#925f00}.ok{background:#e5f7ef;color:#08794e}.actions button{border:0;border-radius:6px;padding:6px;cursor:pointer}.empty{padding:24px;text-align:center;color:#68768b}.hidden{display:none}@media(max-width:800px){.shell{grid-template-columns:1fr}.side{padding:12px}.side nav{display:grid;grid-template-columns:repeat(3,1fr)}.side button{text-align:center;padding:9px 4px;font-size:12px}.cards{grid-template-columns:repeat(2,1fr)}.main{padding:14px}.form{grid-template-columns:1fr 1fr}}@media(max-width:500px){.form{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><div class="shell"><aside class="side"><h2>🏏 DK CRICKET OPS</h2><p class="muted" style="color:#a9b7d1">Tournament organiser workspace</p><nav id="nav"><button class="active" data-page="dashboard">Dashboard</button><button data-page="matches">Matches</button><button data-page="teams">Teams & Payments</button><button data-page="expenses">Expenses</button><button data-page="finance">Finance</button><button data-page="backup">Backup & Settings</button></nav><p class="muted" style="color:#a9b7d1">AK Club DY Patil · MCG · Lords of Maval</p></aside><main class="main"><header class="top"><div><div class="muted">TOURNAMENT CONTROL ROOM</div><h1 id="title">Dashboard</h1><div id="today" class="muted"></div></div><button class="btn" onclick="newRecord()">+ Add record</button></header><div id="content"></div></main></div><script>
const KEY='dkCricketOps_v1';const DEFAULT_TOURNAMENTS=['CCL Pune (Corporate T20 Champions League)','CCL Corporate Champions League','DY Patil T20 Winter Championship Season 1','Winter Championship','Pink Ball County Cup','100 Ball Corporate Champions Cup','Corporate Strikers Championship 26-27','AK Club Quadrangular Cup','AK Club T20 Premier League','DY Patil AK Club T20 Summer Championship'];let db={matches:[],teams:[],expenses:[],payments:[],tournaments:[...DEFAULT_TOURNAMENTS]};let page='dashboard';const $=s=>document.querySelector(s);const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const DEFAULT_FIXTURES=[
{date:'2026-10-10',time:'10:30 AM',ground:'AK Club DY Patil Ground',tournament:'CCL Pune (Corporate T20 Champions League)',a:'Phoenix Risers',b:'Titan Wolves',status:'Completed'},
{date:'2026-10-10',time:'02:00 PM',ground:'AK Club DY Patil Ground',tournament:'CCL Pune (Corporate T20 Champions League)',a:'Boundary Line',b:'Royals 11',status:'Completed'},
{date:'2026-10-10',time:'10:30 AM',ground:'MCG Ground',tournament:'CCL Pune (Corporate T20 Champions League)',a:'Team Aristo',b:'Scoring Swords',status:'Completed'},
{date:'2026-10-11',time:'10:30 AM',ground:'AK Club DY Patil Ground',tournament:'CCL Pune (Corporate T20 Champions League)',a:'Bharam 11',b:'Scoring Swords',status:'Completed'},
{date:'2026-10-11',time:'10:30 AM',ground:'MCG Ground',tournament:'CCL Pune (Corporate T20 Champions League)',a:'Titan Wolves',b:'Royal Strikers',status:'Completed'},
{date:'2026-10-11',time:'10:30 AM',ground:'Lords of Maval',tournament:'CCL Pune (Corporate T20 Champions League)',a:'Microland',b:'Strikeforge',status:'Completed'},
{date:'2026-10-11',time:'12:00 PM',ground:'MCG Ground',tournament:'CCL Pune (Corporate T20 Champions League)',a:'Sangha University',b:'Practice Match',status:'Completed'},
{date:'2026-10-17',time:'10:30 AM',ground:'AK Club DY Patil Ground',tournament:'CCL Pune (Corporate T20 Champions League)',a:'TopGun Mavericks',b:'Scoring Swords',status:'Scheduled'},
{date:'2026-10-17',time:'02:00 PM',ground:'AK Club DY Patil Ground',tournament:'CCL Pune (Corporate T20 Champions League)',a:'Sangha',b:'BR Bulls',status:'Scheduled'},
{date:'2026-10-18',time:'10:30 AM',ground:'AK Club DY Patil Ground',tournament:'CCL Pune (Corporate T20 Champions League)',a:'Team Aristo',b:'Boundary Line',status:'Scheduled'}
];
function load(){try{db={...db,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}if(!Array.isArray(db.tournaments))db.tournaments=[];const known=new Set(db.tournaments.map(t=>String(t).toLowerCase()));DEFAULT_TOURNAMENTS.forEach(t=>{if(!known.has(t.toLowerCase())){db.tournaments.push(t);known.add(t.toLowerCase())}});if(!Array.isArray(db.matches))db.matches=[];for(const fixture of DEFAULT_FIXTURES){const exists=db.matches.some(m=>m.date===fixture.date&&m.time===fixture.time&&m.ground===fixture.ground&&m.a===fixture.a&&m.b===fixture.b);if(!exists)db.matches.push({...fixture,id:'seed-'+fixture.date+'-'+fixture.ground+'-'+fixture.a+'-'+fixture.b});}localStorage.setItem(KEY,JSON.stringify(db));}function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function received(){return db.payments.reduce((a,x)=>a+ +x.amount,0)}function costs(){return db.expenses.reduce((a,x)=>a+ +x.amount,0)}function expected(){return db.teams.reduce((a,x)=>a+ +x.fee,0)}function balance(t){return +t.fee-db.payments.filter(p=>p.team===t.name).reduce((a,p)=>a+ +p.amount,0)}function field(label,name,type='text',opts=''){return '<label>'+label+(type==='select'?'<select name="'+name+'">'+opts+'</select>':'<input name="'+name+'" type="'+type+'" '+(type==='number'?'min="0" step="0.01"':'')+' required>')+'</label>'}function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td colspan="'+headers.length+'" class="empty">No records yet. Add your first record above.</td></tr>')+'</tbody></table></div>'}function panel(title,body){return '<section class="panel"><h3>'+title+'</h3>'+body+'</section>'}function form(title,fields,submit){return panel(title,'<form class="form" onsubmit="'+submit+'(event)">'+fields.join('')+'<button class="btn wide" type="submit">Save record</button></form>')}function paymentButton(m,side){const paid=!!m[(side==='a'?'paymentA':'paymentB')];const key=side==='a'?'a':'b';return '<button class="pill '+(paid?'ok':'')+'" style="cursor:pointer;border:0" onclick="toggleMatchPayment(\''+String(m.id).replace(/'/g,'')+'\',\''+side+'\')">'+esc(m[key])+': '+(paid?'Paid ✓':'Pending')+'</button>'}function toggleMatchPayment(id,side){const m=db.matches.find(x=>String(x.id)===String(id));if(!m)return;const key=side==='a'?'paymentA':'paymentB';m[key]=!m[key];save()}function render(){ $('#title').textContent=({dashboard:'Dashboard',matches:'Matches',teams:'Teams & Payments',expenses:'Expenses',finance:'Finance',backup:'Backup & Settings'})[page];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let c='';if(page==='dashboard'){let upcoming=[...db.matches].filter(m=>m.status!=='Completed').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8);c='<div class="cards">'+[['Team fees expected',money(expected())],['Payments received',money(received())],['Expenses recorded',money(costs())],['Cash position',money(received()-costs())]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>').join('')+'</div>'+panel('Upcoming matches',table(['Date','Time','Ground','Match','Status','Team A payment','Team B payment'],upcoming.map(m=>'<tr><td>'+esc(m.date)+'</td><td>'+esc(m.time)+'</td><td>'+esc(m.ground)+'</td><td>'+esc(m.a)+' vs '+esc(m.b)+'</td><td>'+esc(m.status)+'</td><td>'+paymentButton(m,'a')+'</td><td>'+paymentButton(m,'b')+'</td></tr>')))}if(page==='matches'){c=form('Add match',[field('Date','date','date'),field('Time / Slot','time','select','<option value="07:00 AM">07:00 AM</option><option value="09:00 AM">09:00 AM</option><option value="10:30 AM">10:30 AM</option><option value="12:00 PM">12:00 PM</option><option value="02:00 PM">02:00 PM</option><option value="03:30 PM">03:30 PM</option>'),field('Ground','ground','select','<option>AK Club DY Patil Ground</option><option>MCG Ground</option><option>Lords of Maval</option>'),field('Tournament','tournament','select',db.tournaments.map(t=>'<option>'+esc(t)+'</option>').join('')),field('Team A','a'),field('Team B','b'),field('Status','status','select','<option>Scheduled</option><option>Completed</option><option>Cancelled</option>')],'addMatch')+panel('All matches',table(['Date','Time','Ground','Tournament','Fixture','Status','Team A payment','Team B payment',''],[...db.matches].sort((a,b)=>a.date.localeCompare(b.date)).map((m,i)=>'<tr><td>'+esc(m.date)+'</td><td>'+esc(m.time)+'</td><td>'+esc(m.ground)+'</td><td>'+esc(m.tournament)+'</td><td>'+esc(m.a)+' vs '+esc(m.b)+'</td><td>'+esc(m.status)+'</td><td>'+paymentButton(m,'a')+'</td><td>'+paymentButton(m,'b')+'</td><td><button onclick="del(\\'matches\\','+i+')">Delete</button></td></tr>')))}if(page==='teams'){c=form('Register team',[field('Team name','name'),field('Captain','captain'),field('Phone','phone','tel'),field('Agreed fee (₹)','fee','number')],'addTeam')+form('Record team payment',[field('Team','team','select',db.teams.map(t=>'<option>'+esc(t.name)+'</option>').join('')) ,field('Amount received (₹)','amount','number'),field('Payment date','date','date'),field('Mode','mode','select','<option>UPI</option><option>Bank transfer</option><option>Cash</option><option>Other</option>'),field('Reference / note','ref')],'addPayment')+panel('Teams & outstanding',table(['Team','Captain','Phone','Fee','Received','Balance'],db.teams.map(t=>'<tr><td>'+esc(t.name)+'</td><td>'+esc(t.captain)+'</td><td>'+esc(t.phone)+'</td><td>'+money(t.fee)+'</td><td>'+money(+t.fee-balance(t))+'</td><td><span class="pill '+(balance(t)<=0?'ok':'')+'">'+money(balance(t))+'</span></td></tr>')))+panel('Payment ledger',table(['Date','Team','Amount','Mode','Reference'],db.payments.map(p=>'<tr><td>'+esc(p.date)+'</td><td>'+esc(p.team)+'</td><td>'+money(p.amount)+'</td><td>'+esc(p.mode)+'</td><td>'+esc(p.ref)+'</td></tr>')))}if(page==='expenses'){c=form('Add expense',[field('Date','date','date'),field('Ground','ground','select','<option>AK Club DY Patil Ground</option><option>MCG Ground</option><option>Lords of Maval</option><option>General / shared</option>'),field('Category','category','select','<option>Ground rent</option><option>Umpire</option><option>Ball</option><option>Trophies</option><option>Livestream</option><option>Food</option><option>Other</option>'),field('Amount (₹)','amount','number'),field('Description','description')],'addExpense')+panel('Expense ledger',table(['Date','Ground','Category','Description','Amount',''],db.expenses.map((e,i)=>'<tr><td>'+esc(e.date)+'</td><td>'+esc(e.ground)+'</td><td>'+esc(e.category)+'</td><td>'+esc(e.description)+'</td><td>'+money(e.amount)+'</td><td><button onclick="del(\'expenses\','+i+')">Delete</button></td></tr>')))}if(page==='finance'){c='<div class="cards">'+[['Expected fees',money(expected())],['Cash received',money(received())],['Pending team fees',money(db.teams.reduce((a,t)=>a+Math.max(0,balance(t)),0))],['Total expenses',money(costs())]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>').join('')+'</div>'+panel('Cash summary','<h2>Net cash position: '+money(received()-costs())+'</h2><p class="muted">Net cash position = recorded payments received minus recorded expenses. Expected unpaid fees are not counted as cash.</p><button class="btn" onclick="csv()">Export finance CSV</button>')}if(page==='backup'){c=form('Add tournament',[field('Tournament name','name')],'addTournament')+panel('Manage tournament names',table(['Tournament','Action'],db.tournaments.map((t,i)=>'<tr><td>'+esc(t)+'</td><td><button onclick="deleteTournament('+i+')">Remove</button></td></tr>')))+panel('Data backup & restore','<p><b>Where is data saved?</b> Matches, teams, payments, expenses and tournament names are saved in this browser profile on this device (Local Storage), not in a shared online database.</p><button class="btn" onclick="backup()">Download JSON backup</button> <label style="display:inline-block">Restore backup <input type="file" accept="application/json" onchange="restore(event)"></label><p class="muted">Backup regularly and before changing devices. Clearing browser/site data, using a different browser profile, or using another laptop may make records unavailable. Restore the downloaded JSON file to recover them. GitHub updates the app code only; it does not back up your records automatically. Avoid storing passwords or highly sensitive personal information here.</p>')};$('#content').innerHTML=c}function vals(e){return Object.fromEntries(new FormData(e.target).entries())}function addMatch(e){e.preventDefault();db.matches.push({...vals(e),id:Date.now()});save()}function addTournament(e){e.preventDefault();let name=String(e.target.name.value||'').trim();if(!name)return;if(db.tournaments.some(t=>t.toLowerCase()===name.toLowerCase())){alert('That tournament name already exists.');return}db.tournaments.push(name);db.tournaments.sort((a,b)=>a.localeCompare(b));save()}function deleteTournament(i){let name=db.tournaments[i];if(db.matches.some(m=>m.tournament===name)){alert('This tournament is used by a saved match. Keep it in the list so existing records stay consistent.');return}if(confirm('Remove tournament '+name+' from the dropdown?')){db.tournaments.splice(i,1);if(!db.tournaments.length)db.tournaments=['CCL Corporate Champions League'];save()}}function addTeam(e){e.preventDefault();db.teams.push({...vals(e),fee:+e.target.fee.value,id:Date.now()});save()}function addPayment(e){e.preventDefault();db.payments.push({...vals(e),amount:+e.target.amount.value,id:Date.now()});save()}function addExpense(e){e.preventDefault();db.expenses.push({...vals(e),amount:+e.target.amount.value,id:Date.now()});save()}function del(k,i){if(confirm('Delete this record?')){db[k].splice(i,1);save()}}function newRecord(){page=page==='dashboard'?'matches':page;render();window.scrollTo(0,0)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='dk-cricket-ops-backup.json';a.click();URL.revokeObjectURL(a.href)}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert('Backup restored')}catch(x){alert('Invalid backup file')}};r.readAsText(f)}function csv(){let rows=[['Type','Date','Name','Category','Amount'],...db.payments.map(p=>['Income',p.date,p.team,p.mode,p.amount]),...db.expenses.map(x=>['Expense',x.date,x.ground,x.category,x.amount])];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='dk-cricket-finance.csv';a.click();URL.revokeObjectURL(a.href)}$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b){page=b.dataset.page;render()}});$('#today').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});load();render();
</script></body></html>
