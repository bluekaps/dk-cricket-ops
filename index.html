}.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.sheet-head h2{font-size:16px;margin:0;color:#163b63}.sheet-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tools input,.tools select{padding:8px;border:1px solid var(--line);border-radius:5px;background:white}.notice{padding:9px 11px;background:#edf5ff;border:1px solid #c9def5;border-radius:5px;margin:8px 0 11px;color:#244a70}.table-wrap{overflow:auto;max-height:calc(100vh - 300px);border:1px solid #b7c5d6;position:relative}.grid{border-collapse:separate;border-spacing:0;white-space:nowrap;min-width:100%;font-size:12px}.grid th,.grid td{border-right:1px solid #c9d4e1;border-bottom:1px solid #c9d4e1;padding:0;min-width:132px}.grid th{position:sticky;top:0;z-index:5;background:#dbe6f3;color:#193b5e;text-align:center;padding:9px 8px;font-weight:800;white-space:normal}.grid td{background:#fff}.grid tr:nth-child(even) td{background:#f9fbfd}.grid input,.grid select,.grid textarea{width:100%;min-width:100%;border:0;border-radius:0;padding:8px 7px;background:transparent;color:#152c46;font:inherit;outline-offset:-2px}.grid input:focus,.grid select:focus,.grid textarea:focus{outline:2px solid #2d7cc3;background:#fff}.grid .date-col{min-width:116px}.grid .day-col{min-width:100px}.grid .ground-col{min-width:190px}.grid .slot-col{min-width:190px}.grid .notes-col{min-width:270px}.grid .status-col{min-width:130px}.schedule th:nth-child(1),.schedule td:nth-child(1){position:sticky;left:0;z-index:4;min-width:116px}.schedule th:nth-child(2),.schedule td:nth-child(2){position:sticky;left:116px;z-index:4;min-width:100px}.schedule th:nth-child(3),.schedule td:nth-child(3){position:sticky;left:216px;z-index:4;min-width:190px;box-shadow:2px 0 3px #bdc9d7}.schedule th:nth-child(-n+3){z-index:7}.schedule td:nth-child(1),.schedule td:nth-child(2),.schedule td:nth-child(3){background:#f2f6fb}.schedule .ground-first{background:#d9ead3!important;font-weight:700}.schedule .ground-blank{background:#fff2cc!important}.schedule .tennis-cell{background:#d9eaf7!important}.schedule .leather-cell{background:#e2f0d9!important}.schedule .notes-cell{background:#fff2cc!important}.schedule .status-cell{background:#fce4d6!important}.schedule .tournament-cell{background:#edf3fa!important}.schedule .date-cell{font-weight:700}.tracker{min-width:1450px}.tracker th{min-width:125px}.tracker th:first-child,.tracker td:first-child{position:sticky;left:0;z-index:4;min-width:116px}.tracker th:nth-child(2),.tracker td:nth-child(2){position:sticky;left:116px;z-index:4;min-width:100px}.tracker th:nth-child(3),.tracker td:nth-child(3){position:sticky;left:216px;z-index:4;min-width:190px;box-shadow:2px 0 3px #bdc9d7}.tracker th:nth-child(-n+3){z-index:7}.paid{background:var(--green)!important}.pending{background:var(--orange)!important}.na{background:#e7eaf0!important}.small{font-size:11px;color:var(--muted)}.status-chip{display:inline-block;padding:3px 7px;border-radius:10px;background:#e7edf5;font-weight:700}.footer{padding:12px 2px;color:#718096;font-size:11px}.empty{padding:30px;text-align:center;color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(160px,1fr));gap:10px}.form-grid label{display:flex;flex-direction:column;gap:4px;color:#486079;font-weight:700}.form-grid input,.form-grid select,.form-grid textarea{padding:9px;border:1px solid var(--line);border-radius:5px;font:inherit}.help-list{max-width:1000px}.help-list li{margin:9px 0}.teams-grid{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:10px}.team-card{border:1px solid var(--line);border-radius:7px;overflow:hidden}.team-card h3{background:var(--head);margin:0;padding:10px;font-size:12px}.team-card textarea{width:100%;min-height:180px;border:0;padding:10px;font:inherit;resize:vertical}.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.file-input{display:none}@media(max-width:800px){.shell{padding:8px}.summary{grid-template-columns:repeat(2,minmax(120px,1fr))}.topbar{padding:13px}.topbar h1{font-size:16px}.sheet{padding:8px}.form-grid{grid-template-columns:1fr}.teams-grid{grid-template-columns:1fr}.table-wrap{max-height:70vh}.schedule th:nth-child(2),.schedule td:nth-child(2){left:100px}.schedule th:nth-child(3),.schedule td:nth-child(3){left:185px}.schedule th:nth-child(1),.schedule td:nth-child(1){min-width:100px}.schedule th:nth-child(2),.schedule td:nth-child(2){min-width:85px}.schedule th:nth-child(3),.schedule td:nth-child(3){min-width:170px}}
</style></head><body>
<header class="topbar"><div class="brand"><div class="logo">DK<br>OPS</div><div><h1>DK CRICKET OPS</h1><p>Weekend Ground Schedule · Team Payment Workbook</p></div></div><div class="actions"><button class="btn" onclick="downloadBackup()">Download Backup</button><button class="btn" onclick="document.getElementById('restoreFile').click()">Restore Backup</button><input id="restoreFile" class="file-input" type="file" accept=".json,application/json" onchange="restoreBackup(event)"><button class="btn dark" onclick="resetLocal()">Reset to Original Workbook</button></div></header>
<main class="shell"><div class="summary" id="summary"></div><nav class="tabs" id="tabs"></nav><section class="sheet" id="sheet"></section><div class="footer">DK Cricket Ops · Workbook-style layout · Edits save automatically in this browser. Download a backup regularly to move data to another device.</div></main>
<script>
const KEY='dk-cricket-ops-workbook-v2';
const slotNames=['07:00 AM Slot','09:00 AM Tennis Slot','Leather Slot','10:30 AM Slot','12:00 PM Slot','02:00 PM Slot','03:30 PM Slot'];
const tournamentNames=['CCL','Winter Championship','Pink County Cup','Corporate Strikers','AK Club Quadrangular'];
const grounds=['AK Club DY Patil Ground','MCG Ground','Lords of Maval'];
const paymentOptions=['Pending','Paid','Not Applicable'];
const seedRows=[
{date:'2026-10-03',ground:grounds[0],slots:['Booked CT1 Bhushan','Parents Pay vs Decisive XI','','Ktown Night Riders vs Western Warriors','','Hitman Sports vs Boundaryline',''],notes:'Slot conflict 09:00 AM Tennis Slot: EPAM CC (Lords of Maval); Slot conflict 10:30 AM Slot: Team Aristo vs Scoring Swords (Lords of Maval); Booked CT1 Bhushan',status:'Scheduled'},
{date:'2026-10-04',ground:grounds[0],slots:['Booked LR Arezo Kings','EPAM CC','','Titan Wolves vs Royal Strikers','','Practice Match',''],notes:'Booked LR Arezo Kings',status:'Scheduled'},
{date:'2026-10-10',ground:grounds[0],slots:['Booked DC United','EPAM CC','','Phoenix Risers vs Overtime Hitters','','Batboys vs Boundary Line',''],notes:'Booked DC United; Slot conflict 10:30 AM Slot: Bharam 11 vs Scoring Swords (MCG Ground)',status:'Scheduled'},
{date:'2026-10-11',ground:grounds[0],slots:['Booked LR Arezo Kings','','','Decisive 11 vs Bravebulls','','Boundary Line vs Royals 11',''],notes:'Booked LR Arezo Kings; Slot conflict 10:30 AM Slot: Sangha vs University (MCG Ground); Slot conflict 10:30 AM Slot: Microland vs Strikeforge (Lords of Maval)',status:'Scheduled'},
{date:'2026-10-17',ground:grounds[0],slots:['Booked DC United','','','Strikeforge vs Township (P)','','TopGun Mavericks vs Scoring Swords',''],notes:'Booked DC United',status:'Scheduled'},
{date:'2026-10-18',ground:grounds[0],slots:['Booked CT1 Bhushan','','','SJ Warriors vs Royal Strikers','','Team Aristo vs Boundary Line',''],notes:'Booked CT1 Bhushan',status:'Scheduled'},
{date:'2026-10-24',ground:grounds[0],slots:['Booked CT1 Bhushan','','','Team Aristo vs Phoenix Risers','','Sangha vs BR Bulls — Semi',''],notes:'Booked CT1 Bhushan',status:'Scheduled'},
{date:'2026-10-25',ground:grounds[0],slots:['Booked DC United','','','Pattern Strikers vs Titan Wolves','','Black Caps vs Topguns Cricket Club',''],notes:'Booked DC United',status:'Scheduled'},
{date:'2026-10-31',ground:grounds[0],slots:['Booked DC United','','','OM Cricket Club vs Rising Champions','','Vajra Vikings vs SCC United',''],notes:'Booked DC United',status:'Scheduled'},
{date:'2026-11-01',ground:grounds[0],slots:['','','','Team Aristo vs Hitman Sports','','Phoenix Risers vs Deccan Shiledar',''],notes:'Available',status:'Scheduled'},
{date:'2026-11-07',ground:grounds[0],slots:['','','','Boundary Line vs TopGun Mavericks','','Topguns Cricket Club vs Batboys',''],notes:'Available',status:'Scheduled'},
{date:'2026-11-08',ground:grounds[0],slots:['','','','','','Scoring Swords vs Royals XI',''],notes:'Available',status:'Scheduled'},
{date:'2026-11-14',ground:grounds[0],slots:['','','','Scoring Swords vs Hitman Sports','','Titan Wolves vs OM Cricket Club',''],notes:'Available',status:'Scheduled'},
{date:'2026-11-15',ground:grounds[0],slots:['','','','','','Pattern Strikers vs SCC United',''],notes:'Available',status:'Scheduled'},
{date:'2026-11-21',ground:grounds[0],slots:['','','','Scoring Swords vs Boundary Line','','Vajra Vikings vs Titan Wolves',''],notes:'Available',status:'Scheduled'},
{date:'2026-11-22',ground:grounds[0],slots:['','','','','','Royal Strikers vs Rising Champions',''],notes:'Available',status:'Scheduled'},
{date:'2026-11-28',ground:grounds[0],slots:['','','','','','Team Aristo vs TopGun Mavericks',''],notes:'Available',status:'Scheduled'},
{date:'2026-11-29',ground:grounds[0],slots:['','','','','','Vajra Vikings vs OM Cricket Club',''],notes:'Available',status:'Scheduled'}
];
const teamLists={
'CCL Pune (Corporate T20 Champions League)':['Batboys','Boundary Line Elite - XI','HITMAN SPORTS S4','Royals XI','Scoring Swords (Pune)','Team Aristo','Top Gun Mavericks'],
'Winter Championship':['Batboys','Boundary Line Elite - XI','HITMAN SPORTS S4','Royals XI','Scoring Swords (Pune)','Team Aristo','Top Gun Mavericks'],
'Pink County Cup':['Batboys','Black Caps 11','Shivas Smashers','Topguns Cricket Club'],
'Corporate Strikers':['Batboys','BR Bulls','Pune Titans','Royal Strikers -2024','Royals XI','S.I Warriors','STALLION STRIKERS'],
'AK Club Quadrangular Cup':['Deccan Shiledars','Phoenix Risers','Team Aristo','Titan Wolves']
};
const tabs=[['schedule','Ground Schedule'],['tracker','Leather Payment Tracker'],['teams','Tournament Teams'],['fixtures','Round Robin Fixtures'],['help','How to Schedule']];
let page='schedule',db=loadDb(),searchText='';
function clone(x){return JSON.parse(JSON.stringify(x))}
function freshRows(){
 const out=[];let d=new Date(2026,9,3),end=new Date(2027,1,28);
 while(d<=end){if(d.getDay()===6||d.getDay()===0){const date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');for(let n=0;n<2;n++)out.push({id:date+'-'+n,date,day:dayName(date),ground:n===0?grounds[0]:'',slots:['','','','','','',''],notes:'',status:n===0?'Available':'',tournaments:['','','','',''],payments:''})}d.setDate(d.getDate()+1)}
 seedRows.forEach(s=>{const r=out.find(x=>x.date===s.date&&x.id.endsWith('-0'));if(r)Object.assign(r,clone(s))});
 return out;
}
function freshDb(){return {schedule:freshRows(),payments:{},teams:clone(teamLists),fixtures:buildFixtures(),version:2}}
function loadDb(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.schedule&&d.schedule.length)return d}catch(e){}return freshDb()}
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderSummary()}
function dayName(date){if(!date)return '';return new Date(date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long'})}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function statusClass(v){return v==='Paid'?'paid':v==='Pending'?'pending':v==='Not Applicable'?'na':''}
function fixtureParts(text){const s=String(text||'').trim();if(!s||/^Booked\\s/i.test(s)||s==='Available'||s==='Practice Match')return null;const i=s.toLowerCase().indexOf(' vs ');return i>=0?[s.slice(0,i).trim(),s.slice(i+4).trim()]:[s,'']}
function payKey(r,slot,side){return r.id+'|'+slot+'|'+side}
function payValue(r,slot,side){return db.payments[payKey(r,slot,side)]||'Pending'}
function selectHtml(value,options,attrs){return '<select '+(attrs||'')+'>'+options.map(x=>'<option'+(x===value?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select>'}
function inputCell(r,key,cls,placeholder){return '<input class="'+(cls||'')+'" aria-label="'+esc(placeholder||key)+'" value="'+esc(r[key]||'')+'" data-row="'+esc(r.id)+'" data-key="'+esc(key)+'" placeholder="'+esc(placeholder||'')+'">'}
function scheduleSlotCell(r,i){const cls=i===1?'tennis-cell':i===2?'leather-cell':'';return '<td class="'+cls+'"><input data-row="'+esc(r.id)+'" data-slot="'+i+'" value="'+esc(r.slots[i]||'')+'" aria-label="'+esc(slotNames[i])+'" placeholder="Enter fixture / booking"></td>'}
function renderSummary(){
 const rows=db.schedule||[];const fixtures=rows.reduce((n,r)=>n+r.slots.filter(x=>fixtureParts(x)).length,0);
 const booked=rows.filter(r=>r.ground||r.slots.some(x=>String(x).trim())||r.notes).length;
 let paid=0,pending=0;Object.values(db.payments||{}).forEach(v=>{if(v==='Paid')paid++;else if(v==='Pending')pending++});
 document.getElementById('summary').innerHTML=[['Weekend rows',rows.length],['Booked / noted rows',booked],['Fixtures & tennis entries',fixtures],['Payments marked paid',paid]].map(x=>'<div class="metric"><label>'+x[0]+'</label><strong>'+x[1]+'</strong></div>').join('');
}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(t=>'<button class="tab '+(page===t[0]?'active':'')+'" data-page="'+t[0]+'">'+t[1]+'</button>').join('')}
function header(title,desc,tools){return '<div class="sheet-head"><div><h2>'+title+'</h2><p>'+desc+'</p></div><div class="tools">'+(tools||'')+'</div></div>'}
function renderSchedule(){
 const cols=['Date','Day','Ground','07:00 AM Slot','09:00 AM Tennis Slot','Leather Slot','10:30 AM Slot','12:00 PM Slot','02:00 PM Slot','03:30 PM Slot','Booking / Notes','Ground Status','CCL','Winter Championship','Pink County Cup','Corporate Strikers','AK Club Quadrangular','Payment Received — Team Name(s)'];
 const rows=db.schedule.filter(r=>!searchText||JSON.stringify(r).toLowerCase().includes(searchText.toLowerCase()));
 const body=rows.map(r=>'<tr><td class="date-col date-cell"><input type="date" data-row="'+r.id+'" data-key="date" value="'+esc(r.date)+'"></td><td class="day-col"><input readonly value="'+esc(dayName(r.date))+'"></td><td class="ground-col '+(r.ground===grounds[0]?'ground-first':!r.ground?'ground-blank':'')+'">'+selectHtml(r.ground,grounds.concat(['']), 'data-row="'+r.id+'" data-key="ground"')+'</td>'+r.slots.map((_,i)=>scheduleSlotCell(r,i)).join('')+'<td class="notes-col notes-cell"><input data-row="'+r.id+'" data-key="notes" value="'+esc(r.notes||'')+'" placeholder="Booking / notes"></td><td class="status-col status-cell">'+selectHtml(r.status||'Available',['Available','Booked','Scheduled','Completed','Cancelled'],'data-row="'+r.id+'" data-key="status"')+'</td>'+r.tournaments.map((v,i)=>'<td class="tournament-cell"><input data-row="'+r.id+'" data-tournament="'+i+'" value="'+esc(v||'')+'" placeholder="'+esc(tournamentNames[i])+'"></td>').join('')+'<td><input data-row="'+r.id+'" data-key="payments" value="'+esc(r.payments||'')+'" placeholder="Paid team names"></td></tr>').join('');
 return header('DK CRICKET OPS — WEEKEND GROUND & MATCH SCHEDULE','Exact workbook-style sheet · Oct 2026 – Feb 2027 · Date, Day and Ground stay fixed', '<input id="scheduleSearch" placeholder="Search teams / bookings" value="'+esc(searchText)+'"><button class="btn" onclick="addScheduleRow()">+ Extra row</button><button class="btn" onclick="exportCsv(\'schedule\')">Export CSV</button>')+
 '<div class="notice">Two rows per Saturday/Sunday: AK Club DY Patil Ground first, second row blank for MCG Ground or Lords of Maval only when booked. Enter fixtures in the same time-slot columns as Excel. Use <b>Team A vs Team B</b> to split team payments automatically.</div>'+
 '<div class="table-wrap"><table class="grid schedule"><thead><tr>'+cols.map((c,i)=>'<th class="'+(i===0?'date-col':i===1?'day-col':i===2?'ground-col':i>=3&&i<=9?'slot-col':i===10?'notes-col':'')+'">'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+body+'</tbody></table></div>';
}
function getTrackerRows(){
 return db.schedule.map(r=>{
  const tennis=fixtureParts(r.slots[1]);const matches=[];
  [0,2,3,4,5,6].forEach(i=>{const p=fixtureParts(r.slots[i]);if(p)matches.push({slot:i,text:r.slots[i],a:p[0],b:p[1]})});
  return {r,tennis,matches:matches.slice(0,2)};
 }).filter(x=>x.tennis||x.matches.length);
}
function trackerSelect(r,slot,side){const val=payValue(r,slot,side);return '<select class="'+statusClass(val)+'" data-payment="'+esc(payKey(r,slot,side))+'">'+selectHtml(val,paymentOptions).replace(/^<select[^>]*>|<\\/select>$/g,'')+'</select>'}
function trackerTeam(r,slot,side,name){return '<td>'+ (name?esc(name):'<span class="small">—</span>')+'</td><td>'+ (name?trackerSelect(r,slot,side):'<span class="small">—</span>')+'</td>'}
function renderTracker(){
 const all=getTrackerRows();const rows=all.filter(x=>!searchText||JSON.stringify(x).toLowerCase().includes(searchText.toLowerCase()));
 const heads=['Date','Day','Ground','Tennis Booking / Fixture','Tennis Team A','Tennis A Payment','Tennis Team B','Tennis B Payment','Match 1','Team A','Team A Payment','Team B','Team B Payment','Match 2','Team C','Team C Payment','Team D','Team D Payment'];
 const body=rows.map(x=>{const r=x.r,t=x.tennis,m1=x.matches[0],m2=x.matches[1];return '<tr><td>'+esc(r.date)+'</td><td>'+esc(dayName(r.date))+'</td><td>'+esc(r.ground||'Ground TBC')+'</td><td>'+(t?esc(r.slots[1]):'')+'</td>'+trackerTeam(r,1,'a',t?t[0]:'')+trackerTeam(r,1,'b',t?t[1]:'')+'<td>'+(m1?esc(m1.text):'')+'</td>'+trackerTeam(r,m1?m1.slot:-1,'a',m1?m1.a:'')+trackerTeam(r,m1?m1.slot:-1,'b',m1?m1.b:'')+'<td>'+(m2?esc(m2.text):'')+'</td>'+trackerTeam(r,m2?m2.slot:-1,'a',m2?m2.a:'')+trackerTeam(r,m2?m2.slot:-1,'b',m2?m2.b:'')+'</tr>'}).join('');
 return header('DK CRICKET OPS — TEAM PAYMENT TRACKER','One row per Ground Schedule row · up to two leather matches and one tennis booking', '<input id="trackerSearch" placeholder="Search date / team" value="'+esc(searchText)+'"><button class="btn" onclick="exportCsv(\'tracker\')">Export CSV</button>')+
 '<div class="notice">Payments are linked to the fixture slot. Change a team status here or edit the fixture in Ground Schedule; payment options are <b>Pending / Paid / Not Applicable</b>. Green = Paid, orange = Pending.</div>'+
 '<div class="table-wrap"><table class="grid tracker"><thead><tr>'+heads.map((c,i)=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+body+'</tbody></table></div>';
}
function buildFixtures(){
 const all=[];let n=1;
 Object.entries(teamLists).forEach(([tour,teams])=>{const list=[...new Set(teams)];let round=1;for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++)all.push({tournament:tour,round:round++,matchNo:n++,a:list[i],b:list[j],fixture:list[i]+' vs '+list[j],date:'',ground:'',time:'',status:'To Be Scheduled',payA:'Pending',payB:'Pending',notes:''})});
 return all;
}
function renderTeams(){
 const tours=Object.keys(db.teams);return header('DK CRICKET OPS — TOURNAMENT TEAM DIRECTORY','Edit team names in each tournament list. Changes save automatically.', '<button class="btn" onclick="exportCsv(\'teams\')">Export CSV</button>')+
 '<div class="teams-grid">'+tours.map(t=>'<div class="team-card"><h3>'+esc(t)+'</h3><textarea data-teamlist="'+esc(t)+'" aria-label="'+esc(t)+' teams">'+esc(db.teams[t].join('\\n'))+'</textarea></div>').join('')+'</div>';
}
function renderFixtures(){
 const tours=[...new Set(db.fixtures.map(x=>x.tournament))];const f=db.fixtures.filter(x=>(!searchText||JSON.stringify(x).toLowerCase().includes(searchText.toLowerCase())));const heads=['Tournament','Round','Match No.','Team A','Team B','Fixture','Date','Ground','Time Slot','Status','Team A Payment','Team B Payment','Notes'];
 const body=f.map(x=>'<tr>'+['tournament','round','matchNo','a','b','fixture','date','ground','time','status','payA','payB','notes'].map(k=>'<td>'+((k==='date')?'<input type="date" data-fixture="'+x.matchNo+'" data-key="'+k+'" value="'+esc(x[k]||'')+'">':(k==='ground')?selectHtml(x[k],grounds.concat(['']), 'data-fixture="'+x.matchNo+'" data-key="'+k+'"'):(k==='status')?selectHtml(x[k],['To Be Scheduled','Scheduled','Completed','Cancelled'],'data-fixture="'+x.matchNo+'" data-key="'+k+'"'):(k==='payA'||k==='payB')?selectHtml(x[k],paymentOptions,'data-fixture="'+x.matchNo+'" data-key="'+k+'"'):['round','matchNo'].includes(k)?'<input type="number" data-fixture="'+x.matchNo+'" data-key="'+k+'" value="'+esc(x[k])+'">':'<input data-fixture="'+x.matchNo+'" data-key="'+k+'" value="'+esc(x[k]||'')+'">')+'</td>').join('')+'</tr>').join('');
 return header('DK CRICKET OPS — ROUND ROBIN FIXTURES','Tournament pairings with editable schedule, match status and team payments.', '<input id="fixtureSearch" placeholder="Search fixtures" value="'+esc(searchText)+'"><button class="btn" onclick="exportCsv(\'fixtures\')">Export CSV</button>')+'<div class="table-wrap"><table class="grid"><thead><tr>'+heads.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+body+'</tbody></table></div>';
}
function renderHelp(){return header('DK Cricket Ops — How to Schedule','Quick instructions matching the Excel workbook.')+'<div class="help-list"><ol><li><b>Ground Schedule:</b> Date, Day and Ground are the first three frozen columns. Scroll sideways to see all time slots and tournament columns.</li><li><b>Default rows:</b> Every Saturday and Sunday through 28 February 2027 has two rows. First row defaults to AK Club DY Patil Ground. Second row remains blank for MCG Ground / Lords of Maval only when booked.</li><li><b>Enter fixtures:</b> Type each match as <b>Team A vs Team B</b> in its time-slot cell. Tennis bookings go in the 09:00 AM Tennis Slot.</li><li><b>Automatic payment tracker:</b> Actual fixtures in the schedule appear in Leather Payment Tracker. Team A and Team B payments are separate. Booked labels and Practice Match placeholders are skipped.</li><li><b>Payment statuses:</b> Select Pending, Paid or Not Applicable. Green is Paid; orange is Pending.</li><li><b>Save / move devices:</b> Edits autosave in this browser. Use Download Backup to export all records and Restore Backup on another device. GitHub Pages alone does not provide shared multi-device database sync.</li><li><b>Extra slots:</b> Use + Extra row only when more than two ground rows are actually needed for a date.</li></ol><div class="notice">Grounds supported: AK Club DY Patil Ground · MCG Ground · Lords of Maval.</div></div>'}
function render(){
 renderTabs();renderSummary();const el=document.getElementById('sheet');
 el.innerHTML=page==='schedule'?renderSchedule():page==='tracker'?renderTracker():page==='teams'?renderTeams():page==='fixtures'?renderFixtures():renderHelp();
}
function updateRow(id,key,value){const r=db.schedule.find(x=>x.id===id);if(!r)return;if(key==='date'){const old=r.date;r.date=value;r.day=dayName(value);if(!r.id.includes('-extra-'))r.id=value+'-'+(r.id.endsWith('-1')?'1':'0')}else if(key==='ground')r.ground=value;else if(key==='status')r.status=value;else if(key==='notes')r.notes=value;else if(key==='payments')r.payments=value;save();if(key==='date')render()}
function addScheduleRow(){const date=prompt('Date (YYYY-MM-DD) for the extra ground row:');if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date))return;const count=db.schedule.filter(r=>r.date===date).length;db.schedule.push({id:date+'-extra-'+Date.now(),date,day:dayName(date),ground:'',slots:['','','','','','',''],notes:'',status:'Available',tournaments:['','','','',''],payments:''});save();render()}
function csvEscape(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}
function download(name,content,type){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function downloadBackup(){download('DK_Cricket_Ops_Backup.json',JSON.stringify(db,null,2),'application/json')}
function restoreBackup(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!d.schedule||!d.payments)throw new Error('Not a DK Cricket Ops backup');db=d;save();render();alert('Backup restored successfully.')}catch(err){alert('Could not restore this file. Please choose a DK Cricket Ops JSON backup.')}};reader.readAsText(file);e.target.value=''}
function resetLocal(){if(!confirm('Reset the browser app to the original workbook data? Download a backup first if you need current edits.'))return;db=freshDb();searchText='';save();render()}
function exportCsv(type){
 let rows=[],name=type;
 if(type==='schedule'){rows=[['Date','Day','Ground',...slotNames,'Booking / Notes','Ground Status',...tournamentNames,'Payment Received — Team Name(s)'],...db.schedule.map(r=>[r.date,dayName(r.date),r.ground,...r.slots,r.notes,r.status,...r.tournaments,r.payments])]}
 if(type==='tracker'){rows=[['Date','Day','Ground','Tennis Booking / Fixture','Tennis Team A','Tennis A Payment','Tennis Team B','Tennis B Payment','Match 1','Team A','Team A Payment','Team B','Team B Payment','Match 2','Team C','Team C Payment','Team D','Team D Payment'],...getTrackerRows().map(x=>{const r=x.r,t=x.tennis,m1=x.matches[0],m2=x.matches[1];return [r.date,dayName(r.date),r.ground,t?r.slots[1]:'',t?t[0]:'',t?payValue(r,1,'a'):'',t?t[1]:'',t?payValue(r,1,'b'):'',m1?m1.text:'',m1?m1.a:'',m1?payValue(r,m1.slot,'a'):'',m1?m1.b:'',m1?payValue(r,m1.slot,'b'):'',m2?m2.text:'',m2?m2.a:'',m2?payValue(r,m2.slot,'a'):'',m2?m2.b:'',m2?payValue(r,m2.slot,'b'):'']})]}
 if(type==='teams'){rows=[['Tournament','Team'],...Object.entries(db.teams).flatMap(([t,ts])=>ts.map(x=>[t,x]))]}
 if(type==='fixtures'){rows=[['Tournament','Round','Match No.','Team A','Team B','Fixture','Date','Ground','Time Slot','Status','Team A Payment','Team B Payment','Notes'],...db.fixtures.map(x=>[x.tournament,x.round,x.matchNo,x.a,x.b,x.fixture,x.date,x.ground,x.time,x.status,x.payA,x.payB,x.notes])]}
 download('DK_Cricket_Ops_'+name+'.csv',rows.map(r=>r.map(csvEscape).join(',')).join('\\r\\n'),'text/csv;charset=utf-8');
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;searchText='';render()}});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.row&&t.dataset.slot!==undefined){const r=db.schedule.find(x=>x.id===t.dataset.row);if(r){r.slots[+t.dataset.slot]=t.value;save()}return}
 if(t.dataset.row&&t.dataset.tournament!==undefined){const r=db.schedule.find(x=>x.id===t.dataset.row);if(r){r.tournaments[+t.dataset.tournament]=t.value;save()}return}
 if(t.dataset.row&&t.dataset.key){if(['date','ground','status'].includes(t.dataset.key))return;updateRow(t.dataset.row,t.dataset.key,t.value);return}
 if(t.dataset.teamlist){db.teams[t.dataset.teamlist]=t.value.split('\\n').map(x=>x.trim()).filter(Boolean);db.fixtures=buildFixtures();save();return}
 if(t.dataset.fixture&&t.dataset.key){const x=db.fixtures.find(y=>String(y.matchNo)===t.dataset.fixture);if(x){x[t.dataset.key]=t.value;if(['a','b'].includes(t.dataset.key))x.fixture=x.a+' vs '+x.b;save()}return}
 if(t.id==='scheduleSearch'||t.id==='trackerSearch'||t.id==='fixtureSearch'){searchText=t.value;const pos=t.selectionStart;render();const again=document.getElementById(t.id);if(again){again.focus();again.setSelectionRange(pos,pos)}}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.row&&t.dataset.key){updateRow(t.dataset.row,t.dataset.key,t.value);if(t.dataset.key==='date'||t.dataset.key==='ground'||t.dataset.key==='status')render();return}
 if(t.dataset.payment){db.payments[t.dataset.payment]=t.value;save();render();return}
 if(t.dataset.teamlist){db.teams[t.dataset.teamlist]=t.value.split('\\n').map(x=>x.trim()).filter(Boolean);db.fixtures=buildFixtures();save();render();return}
 if(t.dataset.fixture&&t.dataset.key){const x=db.fixtures.find(y=>String(y.matchNo)===t.dataset.fixture);if(x){x[t.dataset.key]=t.value;if(['a','b'].includes(t.dataset.key))x.fixture=x.a+' vs '+x.b;save();render()}return}
 if(t.dataset.slot!==undefined||t.dataset.tournament!==undefined){save();render()}
});
render();
</script></body></html>
