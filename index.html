<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DK Cricket Ops</title><style>
:root{font-family:Arial,sans-serif;color:#17243b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#101b31;color:white;padding:24px 16px}.side h2{font-size:19px}.side button{display:block;width:100%;text-align:left;padding:12px;border:0;border-radius:8px;background:transparent;color:#c7d2e5;cursor:pointer;margin:4px 0}.side button.active,.side button:hover{background:#253552;color:white}.main{padding:28px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.card,.panel{background:white;border:1px solid #e1e7f0;border-radius:13px;padding:17px;margin-bottom:16px}.muted{color:#68768b;font-size:13px}.metric{font-size:25px;font-weight:bold;margin:8px 0}.btn{background:#2463eb;color:white;border:0;border-radius:8px;padding:10px 13px;cursor:pointer}.secondary{background:#eaf0ff;color:#204fc1}.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.form input,.form select,.form textarea{width:100%;padding:10px;border:1px solid #d7deea;border-radius:8px;background:white}.form label{font-size:12px;font-weight:bold;display:grid;gap:5px}.wide{grid-column:1/-1}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf0f5;font-size:13px;white-space:nowrap}th{background:#f7f9fc}.pill{padding:4px 7px;border-radius:20px;background:#fff2d7;color:#925f00}.ok{background:#e5f7ef;color:#08794e}.actions button{border:0;border-radius:6px;padding:6px;cursor:pointer}.empty{padding:24px;text-align:center;color:#68768b}.hidden{display:none}@media(max-width:800px){.shell{grid-template-columns:1fr}.side{padding:12px}.side nav{display:grid;grid-template-columns:repeat(3,1fr)}.side button{text-align:center;padding:9px 4px;font-size:12px}.cards{grid-template-columns:repeat(2,1fr)}.main{padding:14px}.form{grid-template-columns:1fr 1fr}}@media(max-width:500px){.form{grid-template-columns:1fr}.wide{grid-column:auto}}

(2),.schedule-table td:nth-child(2){min-width:85px}.schedule-table th:nth-child(3),.schedule-table td:nth-child(3){min-width:165px}}
</style></head><body><div class="shell"><aside class="side"><h2>🏏 DK CRICKET OPS</h2><p class="muted" style="color:#a9b7d1">Tournament organiser workspace</p><nav id="nav"><button class="active" data-page="dashboard">Dashboard</button><button data-page="schedule">Weekend Schedule</button><button data-page="tracker">Payment Tracker</button><button data-page="matches">Matches</button><button data-page="teamdb">Teams Database</button><button data-page="teams">Teams & Payments</button><button data-page="expenses">Expenses</button><button data-page="finance">Finance</button><button data-page="backup">Backup & Settings</button></nav><p class="muted" style="color:#a9b7d1">AK Club DY Patil · MCG · Lords of Maval</p></aside><main class="main"><header class="top"><div><div class="muted">TOURNAMENT CONTROL ROOM</div><h1 id="title">Dashboard</h1><div id="today" class="muted"></div></div><button class="btn" onclick="newRecord()">+ Add record</button></header><div id="content"></div></main></div><script>
const KEY='dkCricketOps_v1';const DEFAULT_TOURNAMENTS=['CCL Pune (Corporate T20 Champions League)','CCL Corporate Champions League','DY Patil T20 Winter Championship Season 1','Winter Championship','Pink Ball County Cup','100 Ball Corporate Champions Cup','Corporate Strikers Championship 26-27','AK Club Quadrangular Cup','AK Club T20 Premier League','DY Patil AK Club T20 Summer Championship'];let db={matches:[],teams:[],teamDirectory:[],expenses:[],payments:[],tournaments:[...DEFAULT_TOURNAMENTS]};let page='dashboard';let directoryFormat='Tennis';const $=s=>document.querySelector(s);const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const DEFAULT_FIXTURES=[
{date:'2026-10-10',time:'10:30 AM',ground:'AK Club DY Patil Ground',tournament:'CCL Pune (Corporate T20 Champions League)',a:'Phoenix Risers',b:'Titan Wolves',status:'Completed'},
{date:'2026-10-10',time:'02:00 PM',ground:'AK Club DY Patil Ground',tournament:'CCL Pune (Corporate T20 Champions League)',a:'Boundary Line',b:'Royals 11',status:'Completed'},
{date:'2026-10-10',time:'10:30 AM',ground:'MCG Ground',tournament:'CCL Pune (Corporate T20 Champions League)',a:'Team Aristo',b:'Scoring Swords',status:'Completed'},
{date:'2026-10-11',time:'10:30 AM',ground:'AK Club DY Patil Ground',tournament:'CCL Pune (Corporate T20 Champions League)',a:'Bharam 11',b:'Scoring Swords',status:'Completed'},
{date:'2026-10-11',time:'10:30 AM',ground:'MCG Ground',tournament:'CCL Pune (Corporate T20 Champions League)',a:'Titan Wolves',b:'Royal Strikers',status:'Completed'},
{date:'2026-10-11',time:'10:30 AM',ground:'Lords of Maval',tournament:'CCL Pune (Corporate T20 Champions League)',a:'Microland',b:'Strikeforge',status:'Completed'},
{date:'2026-10-11',time:'12:00 PM',ground:'MCG Ground',tournament:'CCL Pune (Corporate T20 Champions League)',a:'Sangha University',b:'Practice Match',status:'Completed'},
{date:'2026-10-17',time:'10:30 AM',ground:'AK Club DY Patil Ground',tournament:'CCL Pune (Corporate T20 Champions League)',a:'TopGun Mavericks',b:'Scoring Swords',status:'Scheduled'},
{date:'2026-10-17',time:'02:00 PM',ground:'AK Club DY Patil Ground',tournament:'CCL Pune (Corporate T20 Champions League)',a:'Sangha',b:'BR Bulls',status:'Scheduled'},
{date:'2026-10-18',time:'10:30 AM',ground:'AK Club DY Patil Ground',tournament:'CCL Pune (Corporate T20 Champions League)',a:'Team Aristo',b:'Boundary Line',status:'Scheduled'}
];
function load(){try{db={...db,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}if(!Array.isArray(db.tournaments))db.tournaments=[];const known=new Set(db.tournaments.map(t=>String(t).toLowerCase()));DEFAULT_TOURNAMENTS.forEach(t=>{if(!known.has(t.toLowerCase())){db.tournaments.push(t);known.add(t.toLowerCase())}});if(!Array.isArray(db.teamDirectory))db.teamDirectory=[];if(!Array.isArray(db.matches))db.matches=[];for(const fixture of DEFAULT_FIXTURES){const exists=db.matches.some(m=>m.date===fixture.date&&m.time===fixture.time&&m.ground===fixture.ground&&m.a===fixture.a&&m.b===fixture.b);if(!exists)db.matches.push({...fixture,id:'seed-'+fixture.date+'-'+fixture.ground+'-'+fixture.a+'-'+fixture.b});}initWeekendSchedule();localStorage.setItem(KEY,JSON.stringify(db));}function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function received(){return db.payments.reduce((a,x)=>a+ +x.amount,0)}function costs(){return db.expenses.reduce((a,x)=>a+ +x.amount,0)}function expected(){return db.teams.reduce((a,x)=>a+ +x.fee,0)}function balance(t){return +t.fee-db.payments.filter(p=>p.team===t.name).reduce((a,p)=>a+ +p.amount,0)}function field(label,name,type='text',opts=''){return '<label>'+label+(type==='select'?'<select name="'+name+'">'+opts+'</select>':'<input name="'+name+'" type="'+type+'" '+(type==='number'?'min="0" step="0.01"':'')+' required>')+'</label>'}function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td colspan="'+headers.length+'" class="empty">No records yet. Add your first record above.</td></tr>')+'</tbody></table></div>'}function panel(title,body){return '<section class="panel"><h3>'+title+'</h3>'+body+'</section>'}function form(title,fields,submit){return panel(title,'<form class="form" onsubmit="'+submit+'(event)">'+fields.join('')+'<button class="btn wide" type="submit">Save record</button></form>')}function paymentButton(m,side){const paid=!!m[(side==='a'?'paymentA':'paymentB')];const key=side==='a'?'a':'b';return '<button class="pill '+(paid?'ok':'')+'" style="cursor:pointer;border:0" onclick="toggleMatchPayment(\''+String(m.id).replace(/'/g,'')+'\',\''+side+'\')">'+esc(m[key])+': '+(paid?'Paid ✓':'Pending')+'</button>'}function toggleMatchPayment(id,side){const m=db.matches.find(x=>String(x.id)===String(id));if(!m)return;const key=side==='a'?'paymentA':'paymentB';m[key]=!m[key];save()}
function dateDay(iso){if(!iso)return '';const p=iso.split('-').map(Number);return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(p[0],p[1]-1,p[2]).getDay()]}
function dateLabel(iso){if(!iso)return '';const p=iso.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function initWeekendSchedule(){
 if(!Array.isArray(db.scheduleRows))db.scheduleRows=[];
 const seeded=[
  {date:'2026-10-17',slot:1,time:'10:30 AM',ground:'AK Club DY Patil Ground',bookingType:'Leather',tournament:'CCL Pune (Corporate T20 Champions League)',a:'Strikeforge',b:'Township',notes:'',payA:'Pending',payB:'Pending'},
  {date:'2026-10-17',slot:2,time:'02:00 PM',ground:'AK Club DY Patil Ground',bookingType:'Leather',tournament:'CCL Pune (Corporate T20 Champions League)',a:'TopGun Mavericks',b:'Scoring Swords',notes:'',payA:'Pending',payB:'Pending'},
  {date:'2026-10-18',slot:1,time:'10:30 AM',ground:'AK Club DY Patil Ground',bookingType:'Leather',tournament:'CCL Pune (Corporate T20 Champions League)',a:'SJ Warriors',b:'Royal Strikers',notes:'',payA:'Pending',payB:'Pending'},
  {date:'2026-10-18',slot:2,time:'02:00 PM',ground:'AK Club DY Patil Ground',bookingType:'Leather',tournament:'CCL Pune (Corporate T20 Champions League)',a:'Team Aristo',b:'Boundary Line',notes:'',payA:'Pending',payB:'Pending'}
 ];
 seeded.forEach(s=>{if(!db.scheduleRows.some(r=>r.date===s.date&&Number(r.slot)===s.slot))db.scheduleRows.push({...s,id:'slot-'+s.date+'-'+s.slot,status:'Scheduled',seeded:true})});
 const start=new Date(2026,9,17),end=new Date(2027,1,28);
 for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
  if(d.getDay()!==6&&d.getDay()!==0)continue;
  const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  for(let slot=1;slot<=2;slot++){
   if(db.scheduleRows.some(r=>r.date===iso&&Number(r.slot)===slot))continue;
   db.scheduleRows.push({id:'slot-'+iso+'-'+slot,date:iso,slot,time:slot===1?'10:30 AM':'02:00 PM',ground:slot===1?'AK Club DY Patil Ground':'',bookingType:'Leather',tournament:'',a:'',b:'',notes:'',payA:'Pending',payB:'Pending',status:'Scheduled',seeded:true});
  }
 }
 db.scheduleRows.sort((a,b)=>a.date.localeCompare(b.date)||(+a.slot||0)-(+b.slot||0));
}
function persistSchedule(){localStorage.setItem(KEY,JSON.stringify(db))}
function scheduleRow(id){return db.scheduleRows.find(r=>String(r.id)===String(id))}
function setScheduleField(id,key,value){const r=scheduleRow(id);if(!r)return;r[key]=value;if(key==='date')r.day=dateDay(value);persistSchedule();if(key==='payA'||key==='payB')render()}
function statusOptions(value){return ['Paid','Pending','Not Applicable'].map(x=>'<option'+(value===x?' selected':'')+'>'+x+'</option>').join('')}
function groundOptions(value){return '<option value="">— Select ground —</option>'+['AK Club DY Patil Ground','MCG Ground','Lords of Maval'].map(x=>'<option value="'+esc(x)+'"'+(value===x?' selected':'')+'>'+esc(x)+'</option>').join('')}
function scheduleTextInput(r,key,placeholder,extraClass){return '<input class="'+(extraClass||'')+'" value="'+esc(r[key]||'')+'" placeholder="'+esc(placeholder)+'" onchange="setScheduleField(&quot;'+esc(r.id)+'&quot;,&quot;'+key+'&quot;,this.value)" onblur="persistSchedule()">'}
function renderSchedule(){
 const rows=[...db.scheduleRows].sort((a,b)=>a.date.localeCompare(b.date)||(+a.slot||0)-(+b.slot||0));
 const formHtml='<section class="panel"><h3>Add another booking / match slot</h3><form class="form" onsubmit="addScheduleRow(event)">'+
 '<label>Date<input type="date" name="date" required></label>'+
 '<label>Time / slot<select name="time"><option>10:30 AM</option><option>12:00 PM</option><option>02:00 PM</option><option>03:30 PM</option><option>Other / flexible</option></select></label>'+
 '<label>Ground<select name="ground" required><option>AK Club DY Patil Ground</option><option>MCG Ground</option><option>Lords of Maval</option></select></label>'+
 '<label>Booking type<select name="bookingType"><option>Leather</option><option>Tennis</option><option>Ground Booking</option><option>Other</option></select></label>'+
 '<label>Tournament / event<input name="tournament" placeholder="Optional"></label>'+
 '<label>Team A / booked group<input name="a" placeholder="Team or group name"></label>'+
 '<label>Team B (optional)<input name="b" placeholder="Opponent, if applicable"></label>'+
 '<label class="wide">Booking notes<input name="notes" placeholder="e.g. DC United booking, CT1 Bhushan booking"></label>'+
 '<button class="btn wide" type="submit">Add booking to schedule & payment tracker</button></form></section>';
 const tableRows=rows.map(r=>'<tr>'+
 '<td class="date-cell"><input type="date" value="'+esc(r.date)+'" onchange="setScheduleField(&quot;'+esc(r.id)+'&quot;,&quot;date&quot;,this.value)" aria-label="Date"></td>'+
 '<td class="weekend-date">'+esc(dateDay(r.date))+'</td>'+
 '<td><select onchange="setScheduleField(&quot;'+esc(r.id)+'&quot;,&quot;ground&quot;,this.value)">'+groundOptions(r.ground||'')+'</select></td>'+
 '<td>'+scheduleTextInput(r,'time','Time')+'</td>'+
 '<td><select onchange="setScheduleField(&quot;'+esc(r.id)+'&quot;,&quot;bookingType&quot;,this.value)">'+['Leather','Tennis','Ground Booking','Other'].map(x=>'<option'+(r.bookingType===x?' selected':'')+'>'+x+'</option>').join('')+'</select></td>'+
 '<td>'+scheduleTextInput(r,'tournament','Tournament / event')+'</td>'+
 '<td>'+scheduleTextInput(r,'a','Team A / group')+'</td>'+
 '<td>'+scheduleTextInput(r,'b','Team B')+'</td>'+
 '<td class="notes-cell">'+scheduleTextInput(r,'notes','Booking notes')+'</td>'+
 '<td><select onchange="setScheduleField(&quot;'+esc(r.id)+'&quot;,&quot;payA&quot;,this.value)" aria-label="Team A payment">'+statusOptions(r.payA||'Pending')+'</select></td>'+
 '<td><select onchange="setScheduleField(&quot;'+esc(r.id)+'&quot;,&quot;payB&quot;,this.value)" aria-label="Team B payment">'+statusOptions(r.payB||'Pending')+'</select></td>'+
 '<td><button class="subtle-btn" onclick="clearScheduleBooking(&quot;'+esc(r.id)+'&quot;)">Clear</button></td></tr>').join('');
 const htmlTable='<div class="tablewrap"><table class="schedule-table"><thead><tr><th>Date</th><th>Day</th><th>Ground (fixed columns)</th><th>Time / slot</th><th>Type</th><th>Tournament / event</th><th>Team A / group</th><th>Team B</th><th>Notes / booking</th><th>Team A payment</th><th>Team B payment</th><th>Actions</th></tr></thead><tbody>'+tableRows+'</tbody></table></div>';
 const booked=rows.filter(r=>(r.a||r.b||r.notes||r.ground==='MCG Ground'||r.ground==='Lords of Maval')&&r.date).length;
 return '<div class="cards">'+[['Weekend slots',rows.length],['Booked / noted slots',booked],['Tennis bookings',rows.filter(r=>r.bookingType==='Tennis'&&(r.a||r.b||r.notes)).length],['Grounds available',3]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>').join('')+'</div>'+
 '<div class="schedule-hint"><b>How it works:</b> Weekend slots are prepared from 17 Oct 2026 through Feb 2027. Fill the team/group fields for leather or tennis matches, or use Booking notes for ground bookings. The Payment Tracker below reads directly from these rows. Date, day and ground columns stay visible while you scroll sideways.</div>'+
 formHtml+panel('Weekend schedule · October 2026 – February 2027',htmlTable);
}
function addScheduleRow(e){
 e.preventDefault();const v=Object.fromEntries(new FormData(e.target).entries());const n=db.scheduleRows.filter(r=>r.date===v.date).reduce((m,r)=>Math.max(m,+r.slot||0),0)+1;
 db.scheduleRows.push({...v,id:'booking-'+Date.now(),slot:n,status:'Scheduled',payA:'Pending',payB:'Pending',seeded:false});
 db.scheduleRows.sort((a,b)=>a.date.localeCompare(b.date)||(+a.slot||0)-(+b.slot||0));persistSchedule();render();
}
function clearScheduleBooking(id){const r=scheduleRow(id);if(!r)return;if(!confirm('Clear team names, notes and payment statuses for this slot?'))return;r.a='';r.b='';r.notes='';r.tournament='';r.payA='Pending';r.payB='Pending';persistSchedule();render()}
function renderPaymentTracker(){
 const grouped={};[...db.scheduleRows].sort((a,b)=>a.date.localeCompare(b.date)||(+a.slot||0)-(+b.slot||0)).forEach(r=>{if(!r.date)return;(grouped[r.date]||(grouped[r.date]=[])).push(r)});
 const rows=Object.keys(grouped).sort().map(date=>{
  const slots=grouped[date];const a=slots[0]||{},b=slots[1]||{},extra=slots.slice(2);
  const team=(r,k)=>r&&r[k]?esc(r[k]):'—';
  const ground=(r)=>r&&r.ground?esc(r.ground):'<span class="muted">Reserved / unassigned</span>';
  const pay=(r,k)=>r&&r[k]?'<select class="tracker-status" style="background:'+(r[k==='a'?'payA':'payB']==='Paid'?'#e5f7ef':r[k==='a'?'payA':'payB']==='Not Applicable'?'#eef0f4':'#fff2d7')+'" onchange="setScheduleField(&quot;'+esc(r.id)+'&quot;,&quot;'+(k==='a'?'payA':'payB')+'&quot;,this.value)">'+statusOptions(r[k==='a'?'payA':'payB']||'Pending')+'</select>':'<span class="muted">—</span>';
  let main='<tr><td><b>'+esc(dateLabel(date))+'</b><span class="booking-note">'+esc(dateDay(date))+'</span></td><td>'+ground(a)+'<span class="booking-note">'+esc(a.time||'')+'</span></td><td>'+team(a,'a')+'</td><td>'+pay(a,'a')+'</td><td>'+team(a,'b')+'</td><td>'+pay(a,'b')+'</td><td>'+ground(b)+'<span class="booking-note">'+esc(b.time||'')+'</span></td><td>'+team(b,'a')+'</td><td>'+pay(b,'a')+'</td><td>'+team(b,'b')+'</td><td>'+pay(b,'b')+'</td><td>'+[a.notes,b.notes].filter(Boolean).map(esc).join(' · ')+'</td></tr>';
  extra.forEach((x,i)=>{main+='<tr><td><span class="muted">Extra slot '+(i+3)+'</span></td><td>'+ground(x)+'<span class="booking-note">'+esc(x.time||'')+'</span></td><td>'+team(x,'a')+'</td><td>'+pay(x,'a')+'</td><td>'+team(x,'b')+'</td><td>'+pay(x,'b')+'</td><td colspan="5"><span class="muted">Additional booking</span></td><td>'+esc(x.notes||'')+'</td></tr>'});
  return main;
 }).join('');
 const statusSummary=['Paid','Pending','Not Applicable'].map(stat=>{let n=0;db.scheduleRows.forEach(r=>{if(r.a&&r.payA===stat)n++;if(r.b&&r.payB===stat)n++});return '<div class="card"><div class="muted">'+stat+' team payments</div><div class="metric">'+n+'</div></div>'}).join('');
 return '<div class="cards">'+statusSummary+'</div><div class="schedule-hint">Payment status is maintained separately for each team. Change a dropdown here or on the Weekend Schedule page; both views use the same saved record. The tracker shows two matches and up to four team payment statuses per date on one row.</div>'+
 panel('Team payment tracker · one row per date','<div class="tablewrap"><table class="tracker-table"><thead><tr><th>Date / day</th><th>Match 1 ground</th><th>Team A</th><th>Payment</th><th>Team B</th><th>Payment</th><th>Match 2 ground</th><th>Team C</th><th>Payment</th><th>Team D</th><th>Payment</th><th>Booking notes</th></tr></thead><tbody>'+rows+'</tbody></table></div>');
}

function render(){ $('#title').textContent=({dashboard:'Dashboard',matches:'Matches',teamdb:'Teams Database',teams:'Teams & Payments',expenses:'Expenses',finance:'Finance',backup:'Backup & Settings'})[page];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let c='';if(page==='dashboard'){let upcoming=[...db.matches].filter(m=>m.status!=='Completed').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8);c='<div class="cards">'+[['Team fees expected',money(expected())],['Payments received',money(received())],['Expenses recorded',money(costs())],['Cash position',money(received()-costs())]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>').join('')+'</div>'+panel('Upcoming matches',table(['Date','Time','Ground','Match','Status','Team A payment','Team B payment'],upcoming.map(m=>'<tr><td>'+esc(m.date)+'</td><td>'+esc(m.time)+'</td><td>'+esc(m.ground)+'</td><td>'+esc(m.a)+' vs '+esc(m.b)+'</td><td>'+esc(m.status)+'</td><td>'+paymentButton(m,'a')+'</td><td>'+paymentButton(m,'b')+'</td></tr>')))}if(page==='matches'){c=form('Add match',[field('Date','date','date'),field('Time / Slot','time','select','<option value="07:00 AM">07:00 AM</option><option value="09:00 AM">09:00 AM</option><option value="10:30 AM">10:30 AM</option><option value="12:00 PM">12:00 PM</option><option value="02:00 PM">02:00 PM</option><option value="03:30 PM">03:30 PM</option>'),field('Ground','ground','select','<option>AK Club DY Patil Ground</option><option>MCG Ground</option><option>Lords of Maval</option>'),field('Tournament','tournament','select',db.tournaments.map(t=>'<option>'+esc(t)+'</option>').join('')),field('Team A','a'),field('Team B','b'),field('Status','status','select','<option>Scheduled</option><option>Completed</option><option>Cancelled</option>')],'addMatch')+panel('All matches',table(['Date','Time','Ground','Tournament','Fixture','Status','Team A payment','Team B payment',''],[...db.matches].sort((a,b)=>a.date.localeCompare(b.date)).map((m,i)=>'<tr><td>'+esc(m.date)+'</td><td>'+esc(m.time)+'</td><td>'+esc(m.ground)+'</td><td>'+esc(m.tournament)+'</td><td>'+esc(m.a)+' vs '+esc(m.b)+'</td><td>'+esc(m.status)+'</td><td>'+paymentButton(m,'a')+'</td><td>'+paymentButton(m,'b')+'</td><td><button onclick="del(\'matches\','+i+')">Delete</button></td></tr>')))}if(page==='teamdb'){c='<div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap"><button onclick="setDirectoryFormat(\'Tennis\')" style="padding:12px 22px;border-radius:9px;border:0;background:'+(directoryFormat==='Tennis'?'#2563eb':'#e8edf5')+';color:'+(directoryFormat==='Tennis'?'white':'#17233b')+';font-weight:600">Tennis Teams ('+db.teamDirectory.filter(t=>t.format==='Tennis').length+')</button><button onclick="setDirectoryFormat(\'Leather\')" style="padding:12px 22px;border-radius:9px;border:0;background:'+(directoryFormat==='Leather'?'#2563eb':'#e8edf5')+';color:'+(directoryFormat==='Leather'?'white':'#17233b')+';font-weight:600">Leather Teams ('+db.teamDirectory.filter(t=>t.format==='Leather').length+')</button></div>'+form('Add '+directoryFormat.toLowerCase()+' team to database',[field('Team name','name'),field('Format','format','select','<option value="Tennis" '+(directoryFormat==='Tennis'?'selected':'')+'>Tennis</option><option value="Leather" '+(directoryFormat==='Leather'?'selected':'')+'>Leather</option>'),field('Captain name','captain'),field('Primary contact number','phone','tel'),field('Alternative contact number','altPhone','tel'),field('Notes','notes')],'addDirectoryTeam')+panel(directoryFormat+' Teams Directory', '<p class="muted">Search by team name, captain, or contact number.</p><input id="teamSearch" placeholder="Search '+directoryFormat.toLowerCase()+' teams..." oninput="filterDirectory()" style="width:100%;max-width:420px;padding:10px;border:1px solid #d7deea;border-radius:8px;margin-bottom:12px">'+table(['Team name','Captain','Contact number','Alternative contact','Notes',''],db.teamDirectory.map((t,i)=>({t,i})).filter(x=>x.t.format===directoryFormat).map(({t,i})=>'<tr data-team-row><td>'+esc(t.name)+'</td><td>'+esc(t.captain)+'</td><td>'+esc(t.phone)+'</td><td>'+esc(t.altPhone||'—')+'</td><td>'+esc(t.notes||'—')+'</td><td><button onclick="deleteDirectoryTeam('+i+')">Delete</button></td></tr>')))}if(page==='teams'){c=form('Register team',[field('Team name','name'),field('Captain','captain'),field('Phone','phone','tel'),field('Agreed fee (₹)','fee','number')],'addTeam')+form('Record team payment',[field('Team','team','select',db.teams.map(t=>'<option>'+esc(t.name)+'</option>').join('')) ,field('Amount received (₹)','amount','number'),field('Payment date','date','date'),field('Mode','mode','select','<option>UPI</option><option>Bank transfer</option><option>Cash</option><option>Other</option>'),field('Reference / note','ref')],'addPayment')+panel('Teams & outstanding',table(['Team','Captain','Phone','Fee','Received','Balance'],db.teams.map(t=>'<tr><td>'+esc(t.name)+'</td><td>'+esc(t.captain)+'</td><td>'+esc(t.phone)+'</td><td>'+money(t.fee)+'</td><td>'+money(+t.fee-balance(t))+'</td><td><span class="pill '+(balance(t)<=0?'ok':'')+'">'+money(balance(t))+'</span></td></tr>')))+panel('Payment ledger',table(['Date','Team','Amount','Mode','Reference'],db.payments.map(p=>'<tr><td>'+esc(p.date)+'</td><td>'+esc(p.team)+'</td><td>'+money(p.amount)+'</td><td>'+esc(p.mode)+'</td><td>'+esc(p.ref)+'</td></tr>')))}if(page==='expenses'){c=form('Add expense',[field('Date','date','date'),field('Ground','ground','select','<option>AK Club DY Patil Ground</option><option>MCG Ground</option><option>Lords of Maval</option><option>General / shared</option>'),field('Category','category','select','<option>Ground rent</option><option>Umpire</option><option>Ball</option><option>Trophies</option><option>Livestream</option><option>Food</option><option>Other</option>'),field('Amount (₹)','amount','number'),field('Description','description')],'addExpense')+panel('Expense ledger',table(['Date','Ground','Category','Description','Amount',''],db.expenses.map((e,i)=>'<tr><td>'+esc(e.date)+'</td><td>'+esc(e.ground)+'</td><td>'+esc(e.category)+'</td><td>'+esc(e.description)+'</td><td>'+money(e.amount)+'</td><td><button onclick="del(\'expenses\','+i+')">Delete</button></td></tr>')))}if(page==='finance'){c='<div class="cards">'+[['Expected fees',money(expected())],['Cash received',money(received())],['Pending team fees',money(db.teams.reduce((a,t)=>a+Math.max(0,balance(t)),0))],['Total expenses',money(costs())]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>').join('')+'</div>'+panel('Cash summary','<h2>Net cash position: '+money(received()-costs())+'</h2><p class="muted">Net cash position = recorded payments received minus recorded expenses. Expected unpaid fees are not counted as cash.</p><button class="btn" onclick="csv()">Export finance CSV</button>')}if(page==='schedule'){c=renderSchedule()}if(page==='tracker'){c=renderPaymentTracker()}if(page==='backup'){c=form('Add tournament',[field('Tournament name','name')],'addTournament')+panel('Manage tournament names',table(['Tournament','Action'],db.tournaments.map((t,i)=>'<tr><td>'+esc(t)+'</td><td><button onclick="deleteTournament('+i+')">Remove</button></td></tr>')))+panel('Data backup & restore','<p><b>Where is data saved?</b> Matches, teams, payments, expenses and tournament names are saved in this browser profile on this device (Local Storage), not in a shared online database.</p><button class="btn" onclick="backup()">Download JSON backup</button> <label style="display:inline-block">Restore backup <input type="file" accept="application/json" onchange="restore(event)"></label><p class="muted">Backup regularly and before changing devices. Clearing browser/site data, using a different browser profile, or using another laptop may make records unavailable. Restore the downloaded JSON file to recover them. GitHub updates the app code only; it does not back up your records automatically. Avoid storing passwords or highly sensitive personal information here.</p>')};$('#content').innerHTML=c}function vals(e){return Object.fromEntries(new FormData(e.target).entries())}function addMatch(e){e.preventDefault();db.matches.push({...vals(e),id:Date.now()});save()}function addTournament(e){e.preventDefault();let name=String(e.target.name.value||'').trim();if(!name)return;if(db.tournaments.some(t=>t.toLowerCase()===name.toLowerCase())){alert('That tournament name already exists.');return}db.tournaments.push(name);db.tournaments.sort((a,b)=>a.localeCompare(b));save()}function deleteTournament(i){let name=db.tournaments[i];if(db.matches.some(m=>m.tournament===name)){alert('This tournament is used by a saved match. Keep it in the list so existing records stay consistent.');return}if(confirm('Remove tournament '+name+' from the dropdown?')){db.tournaments.splice(i,1);if(!db.tournaments.length)db.tournaments=['CCL Corporate Champions League'];save()}}function setDirectoryFormat(f){directoryFormat=f;render()}function addDirectoryTeam(e){e.preventDefault();const v=vals(e);v.name=String(v.name||'').trim();if(!v.name)return;if(db.teamDirectory.some(t=>t.name.toLowerCase()===v.name.toLowerCase()&&t.format===v.format)){alert('This team is already saved under that format.');return}db.teamDirectory.push({...v,id:Date.now()});db.teamDirectory.sort((a,b)=>a.format.localeCompare(b.format)||a.name.localeCompare(b.name));save()}function deleteDirectoryTeam(i){if(confirm('Delete this team from the directory?')){db.teamDirectory.splice(i,1);save()}}function filterDirectory(){const q=String($('#teamSearch')?.value||'').toLowerCase();document.querySelectorAll('[data-team-row]').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}function addTeam(e){e.preventDefault();db.teams.push({...vals(e),fee:+e.target.fee.value,id:Date.now()});save()}function addPayment(e){e.preventDefault();db.payments.push({...vals(e),amount:+e.target.amount.value,id:Date.now()});save()}function addExpense(e){e.preventDefault();db.expenses.push({...vals(e),amount:+e.target.amount.value,id:Date.now()});save()}function del(k,i){if(confirm('Delete this record?')){db[k].splice(i,1);save()}}function newRecord(){page=page==='dashboard'?'matches':page;render();window.scrollTo(0,0)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='dk-cricket-ops-backup.json';a.click();URL.revokeObjectURL(a.href)}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert('Backup restored')}catch(x){alert('Invalid backup file')}};r.readAsText(f)}function csv(){let rows=[['Type','Date','Name','Category','Amount'],...db.payments.map(p=>['Income',p.date,p.team,p.mode,p.amount]),...db.expenses.map(x=>['Expense',x.date,x.ground,x.category,x.amount])];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='dk-cricket-finance.csv';a.click();URL.revokeObjectURL(a.href)}$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b){page=b.dataset.page;render()}});$('#today').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});load();render();
</script></body></html>
